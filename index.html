<!DOCTYPE html>
<html lang="en">
<head>
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <header>
        <h1>Akan</h1>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Form</a>
        </nav>
    </header>

    <h1 class="title">AKAN NAME GENERATOR</h1>

    <section class="form-box">
        <h2>When were you born</h2>

        <label>Date:</label>
        <input type="number" id="date" placeholder="1-31">
        
        <label>Month:</label>
        <input type="number" id="month" placeholder="1-12">

        <label>Year:</label>
        <input type="number" id="year" placeholder="1800-2026">
        
        <label>Gender:</label>
        <select id="gender">
            <option value="male">Male</option>
            <option value="female">Female</option>
        </select>

        <div class="button-group">
            <button type="button" id="generateBtn">Generate Akan Name</button>
            <button type="button" id="resetBtn">Reset</button>
        </div>
    </section>

    <section class="result-box" id="resultBox" style="display: none;">
        <h2> Your Akan Name </h2>
        <p id="akanName" class="akan-name"></p>
        <p id="dayOfWeek" class="day-info"></p>
        <button type="button" id="closebutton">Close</button>
    </section>

    <footer>
        <p>© 2026 Celebrating Akan Culture</p>
    </footer>

    <script src="code.js" defer></script>
</body>
</html>
