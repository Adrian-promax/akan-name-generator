<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akan Name Generator</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>Akan Name Generator</h1>
            <p class="subtitle">Discover your Akan day name based on your birthday</p>
        </header>

        <div class="form-card">
            <h2>When were you born?</h2>
            
            <form id="akanForm">
                <div class="form-group">
                    <label>Day:</label>
                    <input type="number" id="day" min="1" max="31" placeholder="e.g., 15" required>
                </div>

                <div class="form-group">
                    <label>Month:</label>
                    <input type="number" id="month" min="1" max="12" placeholder="e.g., 5" required>
                </div>

                <div class="form-group">
                    <label>Year:</label>
                    <input type="number" id="year" min="1900" max="2026" placeholder="e.g., 1990" required>
                </div>

                <div class="form-group">
                    <label>Gender:</label>
                    <select id="gender" required>
                        <option value="">-- Select Gender --</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="button-group">
                    <button type="submit" id="generateBtn">Generate Akan Name</button>
                    <button type="button" id="resetBtn">Reset</button>
                </div>
            </form>
        </div>

        <div id="resultCard" class="result-card" style="display: none;">
            <h2>Your Akan Name Is</h2>
            <p id="akanName" class="akan-name"></p>
            <p id="dayInfo" class="day-info"></p>
            <button type="button" id="closeBtn">Close</button>
        </div>

        <footer>
            <p>©Celebrating Akan Culture</p>
        </footer>
    </div>

    <script src="code.js"></script>
</body>
</html>
